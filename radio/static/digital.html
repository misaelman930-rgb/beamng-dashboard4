<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BeamNG">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<title>BeamNG Digital</title>
<style>
/* Цифровой спидометр без canvas: работает в любом браузере телефона. */
:root { --acc: #ffb020; --blue: #4fc3f7; --green: #00e676; --red: #ff1744; --mut: #6b7480; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: #000; color: #e8e8e8; overflow: hidden;
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
body { display: flex; flex-direction: column;
  padding: max(10px, env(safe-area-inset-top)) 16px max(10px, env(safe-area-inset-bottom)); }

.top { display: flex; justify-content: space-between; align-items: center; font-size: 14px; color: var(--mut); }
.top .conn.on { color: var(--green); }
.top a { color: var(--mut); text-decoration: none; border: 1px solid #222a33; border-radius: 6px; padding: 3px 8px; }

.main { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
#speed { font-family: ui-monospace, Consolas, "Courier New", monospace; font-weight: 700; color: #fff;
  font-size: min(42vw, 34vh); line-height: 1; font-variant-numeric: tabular-nums; }
#unit { color: var(--mut); font-size: clamp(14px, 3.5vh, 22px); letter-spacing: .25em; margin-top: 4px; }
#gear { color: var(--blue); font-size: clamp(40px, 11vh, 90px); font-weight: 700; line-height: 1.1; }

.bar { width: 100%; max-width: 560px; height: 14px; background: #1a1d22; border-radius: 7px; overflow: hidden; margin-top: 10px; }
#rpm { height: 100%; width: 0; background: linear-gradient(90deg, #37d67a, #ffb020 75%, #ff1744); transition: width .15s linear; }
#rpmTxt { font-size: 12px; color: var(--mut); margin-top: 4px; font-variant-numeric: tabular-nums; }

.row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 560px; margin-top: 12px; }
.cell { background: #0f1216; border: 1px solid #1d222a; border-radius: 10px; padding: 8px; text-align: center; }
.cell b { display: block; font-size: clamp(20px, 4.5vh, 30px); font-variant-numeric: tabular-nums; }
.cell span { font-size: 12px; color: var(--mut); text-transform: uppercase; letter-spacing: .08em; }

.strip { display: flex; gap: 10px; align-items: stretch; width: 100%; max-width: 900px; margin-top: 12px; }
.lights { flex: 3; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; align-items: center; }
.card { flex: 2; min-width: 0; background: #0f1216; border: 1px solid #1d222a; border-radius: 10px; padding: 8px 12px; }
#cst { color: var(--acc); font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#ctr { color: var(--mut); font-size: 13px; margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lt { min-width: 44px; text-align: center; padding: 7px 10px; border-radius: 6px; background: #15181d; color: #3a3f47; font-weight: 700; font-size: 14px; }
.lt.on { color: #000; }

.bottom { display: flex; align-items: center; gap: 10px; padding-top: 8px; }
#st { flex: 1; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: var(--acc); font-size: 16px; }
button { font: inherit; font-size: 20px; background: #15181d; color: #eee; border: 1px solid #2a303a; border-radius: 10px; padding: 12px 16px; touch-action: manipulation; }
button.big { background: var(--acc); color: #111; border: 0; font-weight: 700; min-width: 64px; }
</style>
</head>
<body>
<div class="top">
  <span id="conn" class="conn">○ Ожидание игры</span>
  <a href="/">круглый вид</a>
</div>

<div class="main">
  <div id="speed">--</div>
  <div id="unit">КМ/Ч</div>
  <div id="gear">N</div>
  <div class="bar"><div id="rpm"></div></div>
  <div id="rpmTxt">-- об/мин</div>

  <div class="row">
    <div class="cell"><b id="fuel">--</b><span>Топливо %</span></div>
    <div class="cell"><b id="temp">--</b><span>Темп. °C</span></div>
  </div>

  <div class="lights">
    <span class="lt" id="l-sl">◀</span>
    <span class="lt" id="l-sr">▶</span>
    <span class="lt" id="l-hb">P</span>
    <span class="lt" id="l-abs">ABS</span>
    <span class="lt" id="l-fb">ДАЛЬН</span>
  </div>
</div>

<div class="strip">
    <div class="lights">
      <span class="lt" id="l-sl">◀</span>
      <span class="lt" id="l-sr">▶</span>
      <span class="lt" id="l-hb">BRAKE</span>
      <span class="lt" id="l-bat">BAT</span>
      <span class="lt" id="l-oil">OIL</span>
      <span class="lt" id="l-fuel">FUEL</span>
      <span class="lt" id="l-abs">ABS</span>
      <span class="lt" id="l-tc">TC</span>
      <span class="lt" id="l-fb">BEAM</span>
    </div>
    <div class="card"><div id="cst">—</div><div id="ctr"></div></div>
  </div>

<div class="bottom">
  <button onclick="cmd('prev')" aria-label="Предыдущая">⏮</button>
  <div id="st" style="display:none"></div>
  <button class="big" id="play" onclick="cmd('play')" aria-label="Пуск/пауза">▶</button>
  <button onclick="cmd('next')" aria-label="Следующая">⏭</button>
</div>

<script>
const $ = id => document.getElementById(id);
let RPM_MAX = 8000;

function light(id, on, color) {
  const el = $(id);
  el.classList.toggle('on', !!on);
  el.style.background = on ? color : '';
}

function setConn(text, on) {
  $('conn').textContent = text;
  $('conn').classList.toggle('on', !!on);
}

function render(d) {
  const t = d.telemetry;
  setConn(d.connected ? '● Подключено к BeamNG' : '○ Ожидание игры', d.connected);
  $('st').textContent = d.station || '—';
  $('cst').textContent = d.station || '—';
  $('ctr').textContent = d.track || '';
  if (d.scale && d.scale.max_rpm) RPM_MAX = d.scale.max_rpm;
  $('play').textContent = d.playing ? '❚❚' : '▶';

  if (!t) {                                   // игры нет — показываем прочерки, а не нули
    $('speed').textContent = '--';
    $('gear').textContent = 'N';
    $('rpm').style.width = '0%';
    $('rpmTxt').textContent = '-- об/мин';
    $('fuel').textContent = '--';
    $('temp').textContent = '--';
    ['l-sl', 'l-sr', 'l-hb', 'l-bat', 'l-oil', 'l-fuel', 'l-abs', 'l-tc', 'l-fb'].forEach(id => light(id, false));
    return;
  }

  $('speed').textContent = Math.round(t.speed_kmh);
  const g = t.gear;
  $('gear').textContent = g === 0 ? 'R' : (g === 1 ? 'N' : String(g - 1));
  const rpm = Math.max(0, t.rpm || 0);
  $('rpm').style.width = Math.min(100, rpm / RPM_MAX * 100) + '%';
  $('rpm').style.background = rpm > 6500 ? '#ff1744' : '';
  $('rpmTxt').textContent = Math.round(rpm) + ' об/мин';
  $('fuel').textContent = Math.round((t.fuel || 0) * 100);
  $('temp').textContent = Math.round(t.engine_temp || 0);

  light('l-sl', t.signal_left, '#00e676');
  light('l-sr', t.signal_right, '#00e676');
  light('l-hb', t.handbrake, '#ff1744');
  light('l-bat', t.battery, '#ff1744');
  light('l-oil', t.oil, '#ff1744');
  light('l-fuel', (t.fuel || 0) < 0.15, '#ffc107');
  light('l-abs', t.abs, '#ffb020');
  light('l-tc', t.tc, '#ffb020');
  light('l-fb', t.fullbeam, '#4fc3f7');
}

let timer = null;
async function poll() {
  try {
    const r = await fetch('/api/state', { cache: 'no-store' });
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
  } catch (e) {
    setConn('○ Нет связи с ПК', false);
  } finally {
    timer = setTimeout(poll, 200);
  }
}

async function cmd(action) {
  try {
    await fetch('/api/cmd', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: action })
    });
  } catch (e) { /* связи нет — кнопка просто ничего не сделает */ }
}

poll();
</script>
</body>
</html>
